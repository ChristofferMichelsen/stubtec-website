<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PLM operating model: people, process and tools</title>
  <desc id="desc">People take accountable roles, processes govern the product lifecycle and tools implement methods, technology and data. The digital thread connects all three layers.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.025"/></pattern>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#e0555c"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/></filter>
    <style>.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:SFMono-Regular,Consolas,monospace}.label{font-size:16px;letter-spacing:2.6px;font-weight:700}.title{font-size:52px;font-weight:780;letter-spacing:-2px}.sub{font-size:21px;fill:#aab3bf}.band-no{font-size:14px;letter-spacing:2px;fill:#e0555c}.band-title{font-size:32px;font-weight:780;fill:#f3f5f7}.band-copy{font-size:16px;fill:#8f99a7}.chip{font-size:17px;font-weight:690;fill:#e2e6eb}.group{font-size:13px;letter-spacing:1.7px;fill:#7f8996}.phase{font-size:19px;font-weight:740;fill:#f3f5f7}.phase-copy{font-size:14px;fill:#8f99a7}.tool-title{font-size:23px;font-weight:760;fill:#f3f5f7}.tool-copy{font-size:15px;fill:#919ba8}.footer{font-size:14px;letter-spacing:1.7px;fill:#76808e}</style>
  </defs>
  <rect width="1600" height="900" fill="#0b0f14"/><rect width="1600" height="900" fill="url(#grid)"/><rect width="14" height="900" fill="#c3262e"/>
  <g class="sans">
    <text x="70" y="55" class="label" fill="#e0555c">STUBTEC / OPERATING MODEL / 03</text>
    <text x="70" y="122" class="title" fill="#f3f5f7">PLM is people, process &amp; tools</text>
    <text x="70" y="160" class="sub">The platform creates value only when accountability, lifecycle decisions and data structures agree.</text>
    <line x1="70" y1="194" x2="1530" y2="194" stroke="#2b3343"/>

    <g filter="url(#shadow)">
      <rect x="70" y="226" width="1460" height="190" rx="16" fill="#111821" stroke="#2b3343"/>
      <rect x="70" y="226" width="244" height="190" rx="16" fill="#141d28"/><rect x="300" y="226" width="14" height="190" fill="#141d28"/>
      <text x="100" y="265" class="mono band-no">01 / ACCOUNTABILITY</text><text x="100" y="310" class="band-title">People</text>
      <text x="100" y="344" class="band-copy">Decide, create, verify</text><text x="100" y="369" class="band-copy">and consume product data.</text>
      <text x="348" y="260" class="mono group">DEFINE</text><text x="742" y="260" class="mono group">REALIZE</text><text x="1124" y="260" class="mono group">USE &amp; LEARN</text>
      <rect x="348" y="280" width="174" height="48" rx="8" fill="#172332" stroke="#365477"/><text x="435" y="310" text-anchor="middle" class="chip">Engineering</text>
      <rect x="536" y="280" width="174" height="48" rx="8" fill="#172332" stroke="#365477"/><text x="623" y="310" text-anchor="middle" class="chip">Design services</text>
      <rect x="348" y="342" width="174" height="48" rx="8" fill="#172332" stroke="#365477"/><text x="435" y="372" text-anchor="middle" class="chip">Product owner</text>
      <rect x="536" y="342" width="174" height="48" rx="8" fill="#172332" stroke="#365477"/><text x="623" y="372" text-anchor="middle" class="chip">Quality</text>
      <rect x="742" y="280" width="174" height="48" rx="8" fill="#20191d" stroke="#6f3036"/><text x="829" y="310" text-anchor="middle" class="chip">Procurement</text>
      <rect x="930" y="280" width="174" height="48" rx="8" fill="#20191d" stroke="#6f3036"/><text x="1017" y="310" text-anchor="middle" class="chip">Manufacturing</text>
      <rect x="742" y="342" width="174" height="48" rx="8" fill="#20191d" stroke="#6f3036"/><text x="829" y="372" text-anchor="middle" class="chip">Suppliers</text>
      <rect x="930" y="342" width="174" height="48" rx="8" fill="#20191d" stroke="#6f3036"/><text x="1017" y="372" text-anchor="middle" class="chip">Release owner</text>
      <rect x="1124" y="280" width="174" height="48" rx="8" fill="#20201a" stroke="#6b6232"/><text x="1211" y="310" text-anchor="middle" class="chip">Sales</text>
      <rect x="1312" y="280" width="174" height="48" rx="8" fill="#20201a" stroke="#6b6232"/><text x="1399" y="310" text-anchor="middle" class="chip">Customers</text>
      <rect x="1124" y="342" width="174" height="48" rx="8" fill="#20201a" stroke="#6b6232"/><text x="1211" y="372" text-anchor="middle" class="chip">Service</text>
      <rect x="1312" y="342" width="174" height="48" rx="8" fill="#20201a" stroke="#6b6232"/><text x="1399" y="372" text-anchor="middle" class="chip">Marketing</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="70" y="438" width="1460" height="174" rx="16" fill="#111821" stroke="#2b3343"/>
      <rect x="70" y="438" width="244" height="174" rx="16" fill="#141d28"/><rect x="300" y="438" width="14" height="174" fill="#141d28"/>
      <text x="100" y="477" class="mono band-no">02 / GOVERNANCE</text><text x="100" y="522" class="band-title">Process</text>
      <text x="100" y="556" class="band-copy">Control points across</text><text x="100" y="581" class="band-copy">the product lifecycle.</text>
      <line x1="389" y1="526" x2="1450" y2="526" stroke="#c3262e" stroke-width="3" marker-end="url(#arrow)"/>
      <g>
        <circle cx="420" cy="526" r="9" fill="#e0555c"/><text x="420" y="483" text-anchor="middle" class="phase">Conceive</text><text x="420" y="574" text-anchor="middle" class="phase-copy">Intent</text>
        <circle cx="655" cy="526" r="9" fill="#e0555c"/><text x="655" y="483" text-anchor="middle" class="phase">Develop</text><text x="655" y="574" text-anchor="middle" class="phase-copy">Define + design</text>
        <circle cx="890" cy="526" r="9" fill="#e0555c"/><text x="890" y="483" text-anchor="middle" class="phase">Release</text><text x="890" y="574" text-anchor="middle" class="phase-copy">Approve</text>
        <circle cx="1125" cy="526" r="9" fill="#e0555c"/><text x="1125" y="483" text-anchor="middle" class="phase">Realize</text><text x="1125" y="574" text-anchor="middle" class="phase-copy">Build + verify</text>
        <circle cx="1360" cy="526" r="9" fill="#e0555c"/><text x="1360" y="483" text-anchor="middle" class="phase">Use</text><text x="1360" y="574" text-anchor="middle" class="phase-copy">Operate + learn</text>
      </g>
    </g>

    <g filter="url(#shadow)">
      <rect x="70" y="634" width="1460" height="162" rx="16" fill="#111821" stroke="#2b3343"/>
      <rect x="70" y="634" width="244" height="162" rx="16" fill="#141d28"/><rect x="300" y="634" width="14" height="162" fill="#141d28"/>
      <text x="100" y="673" class="mono band-no">03 / ENABLEMENT</text><text x="100" y="718" class="band-title">Tools</text>
      <text x="100" y="752" class="band-copy">Implement the operating</text><text x="100" y="777" class="band-copy">model consistently.</text>
      <rect x="348" y="664" width="342" height="102" rx="12" fill="#172332" stroke="#365477"/><text x="378" y="703" class="tool-title">Methods</text><text x="378" y="735" class="tool-copy">TOGAF · ArchiMate · DDD · test strategy</text>
      <rect x="710" y="664" width="374" height="102" rx="12" fill="#20191d" stroke="#6f3036"/><text x="740" y="703" class="tool-title">Technology</text><text x="740" y="735" class="tool-copy">CAD/PDM · Aras PLM · ERP · integration</text>
      <rect x="1104" y="664" width="382" height="102" rx="12" fill="#20201a" stroke="#6b6232"/><text x="1134" y="703" class="tool-title">Data</text><text x="1134" y="735" class="tool-copy">Identity · EBOM · lifecycle · evidence · history</text>
    </g>

    <path d="M800 416V438M800 612V634" stroke="#e0555c" stroke-width="4"/>
    <circle cx="800" cy="427" r="6" fill="#e0555c"/><circle cx="800" cy="623" r="6" fill="#e0555c"/>
    <line x1="70" y1="842" x2="1530" y2="842" stroke="#2b3343"/><text x="70" y="872" class="mono footer">STUBTEC / OPERATING MODEL / ALIGN ACCOUNTABILITY BEFORE CONFIGURATION</text><text x="1530" y="872" text-anchor="end" class="mono footer">PLM-REF-03</text>
  </g>
</svg>
