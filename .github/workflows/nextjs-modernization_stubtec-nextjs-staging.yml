# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - stubtec-nextjs-staging

on:
  push:
    branches:
      - 'nextjs-modernization'
  workflow_dispatch:

# Serialize whole runs: Azure OneDeploy returns HTTP 409 for concurrent deployments.
# Never cancel an active OneDeploy operation; cancellation can leave a stale Azure lock.
concurrency:
  group: stubtec-nextjs-staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Inline site CSS and JavaScript before build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          page = Path('public/index.html')
          html = page.read_text(encoding='utf-8')
          css = Path('public/styles.css').read_text(encoding='utf-8')
          js = Path('public/site.js').read_text(encoding='utf-8')
          css_ref = '<link rel="stylesheet" href="/static-resource?name=styles.css" />'
          js_ref = '<script src="/static-resource?name=site.js" defer></script>'
          assert html.count(css_ref) == 1, 'Expected one CSS reference'
          assert html.count(js_ref) == 1, 'Expected one JS reference'
          assert len(css) > 25000 and len(js) > 6000, 'Unexpected empty site assets'
          assert '</style' not in css.lower() and '</script' not in js.lower()
          html = html.replace(css_ref, '<style data-stubtec-inline-css>\n' + css + '\n</style>')
          html = html.replace(js_ref, '')
          assert html.count('</body>') == 1
          html = html.replace('</body>', '<script data-stubtec-inline-js>\n' + js + '\n</script>\n</body>')
          assert 'data-stubtec-inline-css' in html and 'data-stubtec-inline-js' in html
          page.write_text(html, encoding='utf-8')
          print(f'Inlined {len(css)} CSS and {len(js)} JS characters into {len(html)} HTML characters')
          PY

      - name: Install dependencies and build Next.js
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Package Next.js standalone server
        run: |
          mkdir -p deploy/.next
          cp -a .next/standalone/. deploy/
          cp -a .next/static deploy/.next/static
          if [ -d public ]; then cp -a public deploy/public; fi
          test -f deploy/server.js

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E2D28654BB4B430CB6FDEAA2FF550BFE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_04210B6B62BD4C1BBEC9B64D32146402 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2E9AC709A33B4A5783CB4CE44A879679 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'stubtec-nextjs-staging'
          slot-name: 'Production'
          package: .
          
          startup-command: 'node server.js'
          clean: true

      - name: Restart Azure web app to activate newly deployed standalone server
        run: |
          az webapp restart --name stubtec-nextjs-staging --resource-group stubtec-nextjs-staging_group

      - name: Verify current release on staging and public domain
        shell: bash
        run: |
          set -euo pipefail
          for HOST in "https://stubtec-nextjs-staging-gxencfhtc6dfhph7.swedencentral-01.azurewebsites.net/" "https://www.stubtec.dk/"; do
            echo "Checking $HOST"
            OK=0
            for attempt in $(seq 1 16); do
              STATUS=$(curl --location --silent --show-error --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' -o /tmp/stubtec-check.html -w '%{http_code}' "${HOST}?verify-release=${GITHUB_SHA}" || true)
              if [ "$STATUS" = "200" ] && grep -q 'StubTEC PLM | Aras, CAD/PDM og ERP i ét produktflow' /tmp/stubtec-check.html && grep -q 'data-stubtec-inline-css' /tmp/stubtec-check.html && grep -q 'data-stubtec-inline-js' /tmp/stubtec-check.html && [ "$(wc -c < /tmp/stubtec-check.html)" -gt 60000 ]; then
                echo "PASS: $HOST serves the new StubTEC PLM homepage."
                OK=1
                break
              fi
              echo "Attempt $attempt/16: HTTP $STATUS; current page includes:"
              grep -o -m1 -E 'StubTEC PLM | Aras, CAD/PDM og ERP i ét produktflow|Connect engineering|Control complexity' /tmp/stubtec-check.html || true
              sleep 12
            done
            if [ "$OK" != 1 ]; then
              echo "::error::$HOST still does not serve the new StubTEC PLM homepage after deployment and restart."
              exit 1
            fi
          done

          echo "Verifying inlined CSS/JavaScript plus separately served SVG and photo assets."
          for HOST in "https://stubtec-nextjs-staging-gxencfhtc6dfhph7.swedencentral-01.azurewebsites.net/" "https://www.stubtec.dk/"; do
            for NAME in assets/diagrams/digital-thread.svg assets/diagrams/lifecycle.svg assets/diagrams/people-process-tools.svg assets/diagrams/conventional-to-aras.svg assets/diagrams/aras-framework.svg assets/christoffer-architecture-review.jpg; do
              for ATTEMPT in 1 2 3 4; do
                CODE=$(curl --location --silent --show-error --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -D /tmp/asset-headers.txt -o /tmp/stubtec-asset -w '%{http_code}' "${HOST}static-resource?name=${NAME}&verify-release=${GITHUB_SHA}" || true)
                if [ "$CODE" = "200" ]; then break; fi
                sleep 5
              done
              if [ "$CODE" != "200" ]; then
                echo "::error::Missing asset ${HOST}${NAME}: HTTP $CODE"
                exit 1
              fi
              case "$NAME" in
                *.css) EXPECTED="text/css" ;;
                *.js) EXPECTED="text/javascript" ;;
                *.svg) EXPECTED="image/svg+xml" ;;
                *.jpg) EXPECTED="image/jpeg" ;;
              esac
              if ! grep -qi "content-type: $EXPECTED" /tmp/asset-headers.txt; then
                echo "::error::Unexpected content type for ${HOST}${NAME}"
                cat /tmp/asset-headers.txt
                exit 1
              fi
              SIZE=$(wc -c < /tmp/stubtec-asset)
              if [ "$SIZE" -lt 1000 ]; then
                echo "::error::Asset ${HOST}${NAME} unexpectedly small: $SIZE bytes"
                exit 1
              fi
              echo "PASS: ${HOST}${NAME} ($SIZE bytes, $EXPECTED)"
            done
          done
