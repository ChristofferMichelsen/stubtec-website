# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - stubtec-nextjs-staging

on:
  push:
    branches:
      - 'nextjs-modernization'
  workflow_dispatch:

# Serialize whole runs: Azure OneDeploy returns HTTP 409 for concurrent deployments.
# Never cancel an active OneDeploy operation; cancellation can leave a stale Azure lock.
concurrency:
  group: stubtec-nextjs-staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies and build Next.js
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Package Next.js standalone server
        run: |
          mkdir -p deploy/.next
          cp -a .next/standalone/. deploy/
          cp -a .next/static deploy/.next/static
          if [ -d public ]; then cp -a public deploy/public; fi
          test -f deploy/server.js

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E2D28654BB4B430CB6FDEAA2FF550BFE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_04210B6B62BD4C1BBEC9B64D32146402 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2E9AC709A33B4A5783CB4CE44A879679 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'stubtec-nextjs-staging'
          slot-name: 'Production'
          package: .
          
          startup-command: 'node server.js'
          clean: true

      - name: Restart Azure web app to activate newly deployed standalone server
        run: |
          az webapp restart --name stubtec-nextjs-staging --resource-group stubtec-nextjs-staging_group

      - name: Verify current release on staging and public domain
        shell: bash
        run: |
          set -euo pipefail
          for HOST in "https://stubtec-nextjs-staging-gxencfhtc6dfhph7.swedencentral-01.azurewebsites.net/" "https://www.stubtec.dk/"; do
            echo "Checking $HOST"
            OK=0
            for attempt in $(seq 1 16); do
              STATUS=$(curl --location --silent --show-error --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' -o /tmp/stubtec-check.html -w '%{http_code}' "${HOST}?verify-release=${GITHUB_SHA}" || true)
              if [ "$STATUS" = "200" ] && grep -q 'Hej world' /tmp/stubtec-check.html; then
                echo "PASS: $HOST returns Hej world and Next.js styling."
                OK=1
                break
              fi
              echo "Attempt $attempt/16: HTTP $STATUS; current page includes:"
              grep -o -m1 -E 'Hej world|Connect engineering|Control complexity' /tmp/stubtec-check.html || true
              sleep 12
            done
            if [ "$OK" != 1 ]; then
              echo "::error::$HOST still does not serve Hej world after deployment and restart."
              exit 1
            fi
          done
