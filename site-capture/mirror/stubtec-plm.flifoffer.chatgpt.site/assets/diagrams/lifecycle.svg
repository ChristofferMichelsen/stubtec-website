<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Product lifecycle management loop</title>
  <desc id="desc">The product lifecycle runs from idea and requirements through design, manufacture, service, end of life and feedback. PLM governance, data model, workflow, traceability and change control connect every stage.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.025"/></pattern>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#e0555c"/></marker>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#5f9dea"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/></filter>
    <style>.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:SFMono-Regular,Consolas,monospace}.label{font-size:16px;letter-spacing:2.6px;font-weight:700}.title{font-size:52px;font-weight:780;letter-spacing:-2px}.sub{font-size:21px;fill:#aab3bf}.stage-no{font-size:13px;letter-spacing:1.5px;fill:#e0555c}.stage{font-size:23px;font-weight:750;fill:#f3f5f7}.stage-copy{font-size:15px;fill:#8f99a7}.core-kicker{font-size:14px;letter-spacing:2px;fill:#e0555c}.core-title{font-size:39px;font-weight:800;fill:#f3f5f7}.core-row{font-size:17px;fill:#c7cdd5}.footer{font-size:14px;letter-spacing:1.7px;fill:#76808e}</style>
  </defs>
  <rect width="1600" height="900" fill="#0b0f14"/><rect width="1600" height="900" fill="url(#grid)"/><rect width="14" height="900" fill="#c3262e"/>
  <g class="sans">
    <text x="70" y="55" class="label" fill="#e0555c">STUBTEC / PRODUCT LIFECYCLE / 02</text>
    <text x="70" y="122" class="title" fill="#f3f5f7">What is PLM</text>
    <text x="70" y="160" class="sub">A governed data model keeps decisions and configuration connected throughout the product lifecycle.</text>
    <line x1="70" y1="194" x2="1530" y2="194" stroke="#2b3343"/>

    <g fill="none" stroke="#e0555c" stroke-width="3" stroke-linecap="round">
      <path d="M286 483C302 410 320 368 366 338" marker-end="url(#arrow)"/>
      <path d="M486 286C532 254 566 248 622 255" marker-end="url(#arrow)"/>
      <path d="M806 262H874" marker-end="url(#arrow)"/>
      <path d="M1060 273C1114 284 1148 307 1181 342" marker-end="url(#arrow)"/>
      <path d="M1359 395C1402 430 1417 468 1404 508" marker-end="url(#arrow)"/>
      <path d="M1346 604C1305 645 1262 671 1202 690" marker-end="url(#arrow)"/>
    </g>
    <path d="M1110 730C842 822 448 806 203 602" fill="none" stroke="#5f9dea" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow-blue)"/>
    <text x="638" y="795" class="mono stage-no" fill="#8ebcf1">FEEDBACK CLOSES THE LOOP</text>

    <g filter="url(#shadow)">
      <rect x="76" y="470" width="216" height="112" rx="14" fill="#111821" stroke="#2b3343"/><rect x="76" y="470" width="7" height="112" rx="3" fill="#5f9dea"/>
      <text x="106" y="503" class="mono stage-no">01 / DISCOVER</text><text x="106" y="537" class="stage">Idea</text><text x="106" y="562" class="stage-copy">Opportunity · intent</text>
      <rect x="294" y="250" width="224" height="112" rx="14" fill="#111821" stroke="#2b3343"/>
      <text x="324" y="283" class="mono stage-no">02 / DEFINE</text><text x="324" y="317" class="stage">Requirements</text><text x="324" y="342" class="stage-copy">Need · constraint · evidence</text>
      <rect x="608" y="214" width="214" height="112" rx="14" fill="#111821" stroke="#2b3343"/>
      <text x="638" y="247" class="mono stage-no">03 / ENGINEER</text><text x="638" y="281" class="stage">Design</text><text x="638" y="306" class="stage-copy">Part · BOM · document</text>
      <rect x="866" y="214" width="224" height="112" rx="14" fill="#111821" stroke="#2b3343"/>
      <text x="896" y="247" class="mono stage-no">04 / REALIZE</text><text x="896" y="281" class="stage">Manufacture</text><text x="896" y="306" class="stage-copy">Build · verify · release</text>
      <rect x="1162" y="324" width="224" height="112" rx="14" fill="#111821" stroke="#2b3343"/>
      <text x="1192" y="357" class="mono stage-no">05 / OPERATE</text><text x="1192" y="391" class="stage">Service</text><text x="1192" y="416" class="stage-copy">Maintain · observe · support</text>
      <rect x="1292" y="510" width="224" height="112" rx="14" fill="#111821" stroke="#2b3343"/>
      <text x="1322" y="543" class="mono stage-no">06 / RETIRE</text><text x="1322" y="577" class="stage">End of life</text><text x="1322" y="602" class="stage-copy">Replace · archive · comply</text>
      <rect x="1052" y="676" width="224" height="112" rx="14" fill="#111821" stroke="#5f9dea"/>
      <text x="1082" y="709" class="mono stage-no" fill="#8ebcf1">07 / LEARN</text><text x="1082" y="743" class="stage">Feedback</text><text x="1082" y="768" class="stage-copy">Field data · quality · change</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="552" y="388" width="496" height="270" rx="20" fill="#111821" stroke="#c3262e" stroke-width="2"/>
      <text x="800" y="431" text-anchor="middle" class="mono core-kicker">PLM CONTROL SYSTEM</text>
      <text x="800" y="478" text-anchor="middle" class="core-title">PLM CORE</text>
      <line x1="602" y1="502" x2="998" y2="502" stroke="#303948"/>
      <text x="626" y="540" class="core-row">Governance</text><text x="626" y="577" class="core-row">Data model</text><text x="626" y="614" class="core-row">Workflow</text>
      <line x1="800" y1="524" x2="800" y2="626" stroke="#303948"/>
      <text x="836" y="540" class="core-row">Traceability</text><text x="836" y="577" class="core-row">Change control</text><text x="836" y="614" class="core-row">Configuration</text>
    </g>

    <line x1="70" y1="842" x2="1530" y2="842" stroke="#2b3343"/><text x="70" y="872" class="mono footer">STUBTEC / LIFECYCLE / DATA + DECISIONS + CHANGE</text><text x="1530" y="872" text-anchor="end" class="mono footer">PLM-REF-02</text>
  </g>
</svg>
