<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Conventional compiled system compared with Aras Innovator framework</title>
  <desc id="desc">A conventional system places behavior in compiled client and server layers above separate data stores. Aras Innovator uses solution models and service layers above a shared database and file vault.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.025"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/></filter>
    <style>.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:SFMono-Regular,Consolas,monospace}.label{font-size:16px;letter-spacing:2.6px;font-weight:700}.title{font-size:52px;font-weight:780;letter-spacing:-2px}.sub{font-size:21px;fill:#aab3bf}.state{font-size:14px;letter-spacing:2px;font-weight:700}.pane-title{font-size:30px;font-weight:790;fill:#f3f5f7}.layer{font-size:22px;font-weight:760;fill:#f3f5f7}.layer-copy{font-size:15px;fill:#99a3af}.chip{font-size:14px;font-weight:700;fill:#dce1e7}.note{font-size:16px;fill:#aab3bf}.footer{font-size:14px;letter-spacing:1.7px;fill:#76808e}</style>
  </defs>
  <rect width="1600" height="900" fill="#0b0f14"/><rect width="1600" height="900" fill="url(#grid)"/><rect width="14" height="900" fill="#c3262e"/>
  <g class="sans">
    <text x="70" y="55" class="label" fill="#e0555c">STUBTEC / PLATFORM ARCHITECTURE / 05</text>
    <text x="70" y="122" class="title" fill="#f3f5f7">Compiled layers vs. model-based behavior</text>
    <text x="70" y="160" class="sub">The difference is where product rules live, how they execute and what an upgrade must preserve.</text>
    <line x1="70" y1="194" x2="1530" y2="194" stroke="#2b3343"/>

    <g filter="url(#shadow)">
      <rect x="70" y="224" width="680" height="574" rx="18" fill="#111821" stroke="#2b3343"/>
      <rect x="70" y="224" width="680" height="92" rx="18" fill="#161b23"/><rect x="70" y="298" width="680" height="18" fill="#161b23"/>
      <text x="104" y="258" class="mono state" fill="#8f99a7">CONVENTIONAL SYSTEM</text><text x="104" y="296" class="pane-title">Behavior embedded in compiled layers</text>

      <rect x="118" y="354" width="552" height="70" rx="10" fill="#172332" stroke="#365477"/><text x="146" y="385" class="layer">Client</text><text x="642" y="385" text-anchor="end" class="layer-copy">UI logic</text><text x="146" y="408" class="layer-copy">Presentation and local rules</text>
      <rect x="118" y="444" width="552" height="70" rx="10" fill="#35191d" stroke="#8e3038"/><text x="146" y="475" class="layer">Compiled logic</text><text x="642" y="475" text-anchor="end" class="layer-copy">Business behavior</text><text x="146" y="498" class="layer-copy">Changes require code, build and deployment</text>
      <rect x="118" y="534" width="552" height="70" rx="10" fill="#25191c" stroke="#603038"/><text x="146" y="565" class="layer">Server code</text><text x="642" y="565" text-anchor="end" class="layer-copy">Services + rules</text><text x="146" y="588" class="layer-copy">Data access and process execution</text>
      <rect x="118" y="624" width="266" height="80" rx="10" fill="#20201a" stroke="#6b6232"/><text x="146" y="658" class="layer">Files</text><text x="146" y="683" class="layer-copy">Separate store</text>
      <rect x="404" y="624" width="266" height="80" rx="10" fill="#20201a" stroke="#6b6232"/><text x="432" y="658" class="layer">Database</text><text x="432" y="683" class="layer-copy">Separate schema</text>
      <path d="M695 376V674" stroke="#e0555c" stroke-width="2" stroke-dasharray="7 7"/>
      <circle cx="695" cy="389" r="5" fill="#e0555c"/><circle cx="695" cy="479" r="5" fill="#e0555c"/><circle cx="695" cy="569" r="5" fill="#e0555c"/><circle cx="695" cy="664" r="5" fill="#e0555c"/>
      <text x="430" y="752" text-anchor="middle" class="note">A business change crosses multiple compiled boundaries.</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="850" y="224" width="680" height="574" rx="18" fill="#111821" stroke="#c3262e" stroke-width="1.5"/>
      <rect x="850" y="224" width="680" height="92" rx="18" fill="#c3262e"/><rect x="850" y="298" width="680" height="18" fill="#c3262e"/>
      <text x="884" y="258" class="mono state" fill="#ffffff">ARAS INNOVATOR</text><text x="884" y="296" class="pane-title">Behavior described by solution models</text>

      <rect x="898" y="354" width="584" height="70" rx="10" fill="#172332" stroke="#365477"/><text x="926" y="385" class="layer">Client</text><text x="1454" y="385" text-anchor="end" class="layer-copy">Generated experience</text><text x="926" y="408" class="layer-copy">Consistent UI consumes the model</text>

      <rect x="898" y="444" width="584" height="142" rx="12" fill="#35191d" stroke="#c3262e"/>
      <text x="926" y="478" class="layer">Solution models</text><text x="1454" y="478" text-anchor="end" class="layer-copy">Configuration layer</text>
      <rect x="926" y="500" width="112" height="44" rx="7" fill="#542128"/><text x="982" y="527" text-anchor="middle" class="chip">Data model</text>
      <rect x="1048" y="500" width="102" height="44" rx="7" fill="#542128"/><text x="1099" y="527" text-anchor="middle" class="chip">Lifecycle</text>
      <rect x="1160" y="500" width="102" height="44" rx="7" fill="#542128"/><text x="1211" y="527" text-anchor="middle" class="chip">Workflow</text>
      <rect x="1272" y="500" width="86" height="44" rx="7" fill="#542128"/><text x="1315" y="527" text-anchor="middle" class="chip">Access</text>
      <rect x="1368" y="500" width="86" height="44" rx="7" fill="#542128"/><text x="1411" y="527" text-anchor="middle" class="chip">UX</text>

      <rect x="898" y="606" width="584" height="70" rx="10" fill="#172332" stroke="#365477"/><text x="926" y="637" class="layer">Web service / SOA</text><text x="1454" y="637" text-anchor="end" class="layer-copy">Stable execution layer</text><text x="926" y="660" class="layer-copy">Open API exposes model-driven capabilities</text>
      <rect x="898" y="696" width="282" height="62" rx="10" fill="#20201a" stroke="#6b6232"/><text x="926" y="733" class="layer">File vault</text>
      <rect x="1200" y="696" width="282" height="62" rx="10" fill="#20201a" stroke="#6b6232"/><text x="1228" y="733" class="layer">Database</text>
      <path d="M1460 376V727" stroke="#5f9dea" stroke-width="2" stroke-dasharray="7 7"/>
      <circle cx="1460" cy="389" r="5" fill="#5f9dea"/><circle cx="1460" cy="515" r="5" fill="#5f9dea"/><circle cx="1460" cy="641" r="5" fill="#5f9dea"/><circle cx="1460" cy="727" r="5" fill="#5f9dea"/>
      <text x="1190" y="782" text-anchor="middle" class="note">Models drive behavior; services expose capabilities.</text>
    </g>

    <line x1="70" y1="842" x2="1530" y2="842" stroke="#2b3343"/><text x="70" y="872" class="mono footer">STUBTEC / ARAS FRAMEWORK / CONFIGURATION IS AN ARCHITECTURAL CHOICE</text><text x="1530" y="872" text-anchor="end" class="mono footer">PLM-REF-05</text>
  </g>
</svg>
